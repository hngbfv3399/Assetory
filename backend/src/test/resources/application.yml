spring:
  datasource:
    url: jdbc:h2:mem:assetory;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: assetory-test-secret-must-be-long-enough-for-hmac-sha
    access-token-expiration: 1800
    refresh-token-expiration: 1209600
